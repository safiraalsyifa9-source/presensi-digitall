<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - Cyber Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff00aa;
            --neon-green: #00ff88;
            --neon-yellow: #ffdd00;
            --neon-purple: #b026ff;
            --dark-bg: #050510;
            --dark-panel: rgba(10, 15, 30, 0.85);
            --grid-line: rgba(0, 240, 255, 0.06);
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            position: relative;
            padding: 16px;
            overflow-x: hidden;
        }

        /* ===== ANIMATED GRID BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== FLOATING NEON ORBS ===== */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 170, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(176, 38, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }

        @keyframes orbFloat {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-20px, 20px); }
        }

        /* ===== MAIN LAYOUT ===== */
        .app-shell {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding-bottom: 20px;
        }

        @media (min-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "header header"
                    "left right"
                    "bottom bottom";
            }
            .zone-header { grid-area: header; }
            .zone-left { grid-area: left; }
            .zone-right { grid-area: right; }
            .zone-bottom { grid-area: bottom; }
        }

        /* ===== HEADER ===== */
        .zone-header {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(176, 38, 255, 0.08));
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .zone-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            animation: headerScan 3s linear infinite;
        }

        @keyframes headerScan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #050510;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(255,255,255,0.3);
            position: relative;
        }

        .brand-logo::after {
            content: '';
            position: absolute;
            inset: -3px;
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            opacity: 0.4;
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { inset: -3px; opacity: 0.4; }
            50% { inset: -8px; opacity: 0; }
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 500;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glow);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }

        .header-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: blink 1.5s ease-in-out infinite;
        }

        .header-status .dot.offline {
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
        }
        .header-status .dot.checking {
            background: var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow);
        }
        .header-status .dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== PANELS ===== */
        .panel {
            background: var(--dark-panel);
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
        }

        .panel-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .panel-label i {
            font-size: 12px;
        }

        .panel-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-glow), transparent);
        }

        /* ===== LEFT ZONE - QR + ACTIONS ===== */
        .zone-left {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .qr-panel {
            text-align: center;
        }

        .qr-frame {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(176, 38, 255, 0.1));
            border: 1px solid var(--border-glow);
            padding: 16px;
            border-radius: 4px;
            display: inline-block;
            position: relative;
            margin-bottom: 12px;
        }

        .qr-frame::before,
        .qr-frame::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid var(--neon-cyan);
        }
        .qr-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .qr-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        #qrImage {
            width: 180px;
            height: 180px;
            display: block;
            border-radius: 2px;
            background: #fff;
            padding: 8px;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
        }

        .qr-caption {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .qr-caption i {
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* ===== ACTION GRID ===== */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .action-btn {
            padding: 12px 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            border-radius: 3px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .action-btn i {
            font-size: 16px;
            color: var(--neon-cyan);
            transition: all 0.25s;
        }

        .action-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
            transform: translateY(-2px);
        }

        .action-btn:hover i {
            transform: scale(1.2);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        .action-btn.green i { color: var(--neon-green); }
        .action-btn.green:hover { border-color: var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .action-btn.pink i { color: var(--neon-pink); }
        .action-btn.pink:hover { border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(255, 0, 170, 0.3); }

        /* ===== GENERATE SECTION ===== */
        .gen-input-group {
            display: flex;
            gap: 8px;
        }

        .gen-input-group input {
            flex: 1;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            border-radius: 3px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .gen-input-group input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15), inset 0 0 12px rgba(0, 240, 255, 0.1);
        }

        .gen-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        .gen-input-group button {
            padding: 12px 18px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            border-radius: 3px;
            color: #050510;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .gen-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        /* ===== QR PREVIEW ===== */
        .qr-preview {
            margin-top: 14px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--border-glow);
            border-radius: 3px;
            text-align: center;
            display: none;
        }

        .qr-preview.show {
            display: block;
            animation: previewIn 0.4s ease;
        }

        @keyframes previewIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .qr-preview img {
            max-width: 150px;
            background: #fff;
            padding: 8px;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .qr-preview .qr-info {
            margin-top: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .qr-preview .qr-info strong { color: var(--neon-cyan); }

        .qr-preview .qr-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .qr-preview .qr-actions button {
            padding: 8px 16px;
            border: 1px solid var(--border-glow);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.25s;
        }

        .qr-preview .qr-actions .btn-download {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }
        .qr-preview .qr-actions .btn-download:hover {
            background: var(--neon-green);
            color: #050510;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .qr-preview .qr-actions .btn-close:hover {
            background: rgba(255, 0, 170, 0.2);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* ===== RIGHT ZONE - SCANNER ===== */
        .zone-right {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .scanner-panel {
            position: relative;
        }

        .scanner-viewport {
            position: relative;
            background: #000;
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            overflow: hidden;
            min-height: 300px;
            aspect-ratio: 1;
            width: 100%;
        }

        #qr-reader {
            width: 100% !important;
            height: 100% !important;
            background: #000;
            position: relative;
        }

        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        #qr-reader > div:not(:first-child) { display: none !important; }
        #qr-reader > div:first-child { width: 100% !important; height: 100% !important; }
        #qr-reader > div:first-child > div:first-child { width: 100% !important; height: 100% !important; }

        /* ===== SCANNER OVERLAY ===== */
        .scanner-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .scanner-overlay .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            height: 65%;
            border-radius: 4px;
            box-shadow: 0 0 0 4000px rgba(5, 5, 16, 0.7);
        }

        .scanner-overlay .corner {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: var(--neon-cyan);
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 6px var(--neon-cyan));
        }
        .corner-tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
        .corner-tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
        .corner-bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
        .corner-br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }

        .scan-line-h {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
            animation: scanV 2.5s ease-in-out infinite;
        }

        @keyframes scanV {
            0%, 100% { top: 5%; opacity: 0.4; }
            50% { top: 95%; opacity: 1; }
        }

        .scan-label {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 16, 0.9);
            border: 1px solid var(--neon-cyan);
            padding: 6px 16px;
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .scan-label i {
            animation: blink 1.2s ease-in-out infinite;
        }

        /* ===== SCANNER CONTROLS ===== */
        .scanner-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .scan-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border-glow);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .scan-btn.primary {
            background: linear-gradient(135deg, var(--neon-green), #00aa55);
            border-color: var(--neon-green);
            color: #050510;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .scan-btn.primary:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }
        .scan-btn.primary.stop {
            background: linear-gradient(135deg, #ff3366, #cc0044);
            border-color: #ff3366;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
        }
        .scan-btn.flash {
            flex: 0.3;
        }
        .scan-btn.flash.active {
            background: linear-gradient(135deg, var(--neon-yellow), #ff9900);
            border-color: var(--neon-yellow);
            color: #050510;
            box-shadow: 0 0 20px rgba(255, 221, 0, 0.5);
        }

        /* ===== STATUS MESSAGE ===== */
        #status {
            padding: 12px 16px;
            border-radius: 3px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            border-left: 3px solid;
            text-transform: uppercase;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #status.success {
            display: flex;
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
        }
        #status.error {
            display: flex;
            background: rgba(255, 51, 102, 0.1);
            color: #ff6688;
            border-color: #ff3366;
        }
        #status.info {
            display: flex;
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }
        #status.warning {
            display: flex;
            background: rgba(255, 221, 0, 0.1);
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
        }

        /* ===== BOTTOM ZONE - DATA TABLE ===== */
        .zone-bottom {
            grid-column: 1 / -1;
        }

        .data-table-wrap {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-glow);
            border-radius: 3px;
        }

        .data-table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
        .data-table-wrap::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        .data-table-wrap::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .data-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table-wrap th {
            padding: 12px 14px;
            text-align: left;
            background: rgba(0, 240, 255, 0.08);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .data-table-wrap td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .data-table-wrap tr {
            transition: all 0.2s;
        }
        .data-table-wrap tr:hover td {
            background: rgba(0, 240, 255, 0.04);
            color: #fff;
        }

        .status-hadir {
            color: var(--neon-green) !important;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);

            .gen-input-group button { width: 100%; }
        }
    </style>
</head>
