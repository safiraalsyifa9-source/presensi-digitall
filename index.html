<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #25d366;
            --primary-dark: #128c7e;
            --primary-glow: rgba(37, 211, 102, 0.3);
            --secondary: #667eea;
            --secondary-dark: #764ba2;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(37, 211, 102, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(118, 75, 162, 0.05) 0%, transparent 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(18, 18, 35, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 28px 22px 22px;
            border: 1px solid var(--border);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 26px;
            color: white;
            box-shadow:
                0 12px 40px var(--primary-glow),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .icon-circle::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            border: 1px solid rgba(37, 211, 102, 0.2);
            animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        h1 {
            color: var(--text);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== QR WRAPPER ===== */
        .qr-wrapper {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.1) inset;
            position: relative;
            overflow: hidden;
        }

        .qr-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), #4ade80, var(--primary));
        }

        #qrImage {
            width: 180px;
            height: 180px;
            display: block;
            border-radius: 12px;
            margin: 0 auto;
            image-rendering: pixelated;
        }

        .qr-wrapper .qr-label {
            color: #1a2a3a;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 11px 16px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            flex: 1;
            justify-content: center;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::after { opacity: 1; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--primary-glow); }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4); }

        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4); }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 14px;
            gap: 12px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        /* ===== GENERATE QR SECTION ===== */
        .qr-generate-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .qr-generate-section .qr-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .qr-generate-section .qr-label i {
            color: var(--primary);
            font-size: 14px;
        }

        .qr-input-group {
            display: flex;
            gap: 8px;
        }

        .qr-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 600;
        }

        .qr-input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(0, 0, 0, 0.3);
        }

        .qr-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .qr-input-group button {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            font-family: inherit;
            font-size: 13px;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .qr-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .qr-preview {
            margin-top: 14px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
            display: none;
        }

        .qr-preview.show {
            display: block !important;
            animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-preview img {
            max-width: 160px;
            height: auto;
            border-radius: 10px;
            background: white;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .qr-preview .qr-info {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .qr-preview .qr-info strong { color: #fff; }

        .qr-preview .qr-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .qr-preview .qr-actions button {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .qr-preview .qr-actions .btn-download {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .qr-preview .qr-actions .btn-download:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .qr-preview .qr-actions .btn-close {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid var(--border);
        }
        .qr-preview .qr-actions .btn-close:hover { background: rgba(255, 255, 255, 0.15); }

        /* ===== CONNECTION STATUS ===== */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            margin-bottom: 14px;
            justify-content: center;
            transition: all 0.3s;
        }

        .connection-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }

        .connection-status .dot.online {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
        }
        .connection-status .dot.online::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1px solid rgba(74, 222, 128, 0.4);
            animation: pulseRing 1.5s ease-out infinite;
        }

        .connection-status .dot.offline {
            background: #f87171;
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.6);
            animation: pulse-red 1s ease-in-out infinite;
        }
        .connection-status .dot.checking {
            background: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
            animation: pulse-yellow 0.8s ease-in-out infinite;
        }

        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse-yellow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ===== STATUS MESSAGE ===== */
        #status {
            padding: 14px 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13px;
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            border: 1px solid;
            backdrop-filter: blur(8px);
        }
        #status i { font-size: 16px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        #status.success {
            display: flex;
            background: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.3);
        }
        #status.error {
            display: flex;
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }
        #status.info {
            display: flex;
            background: rgba(59, 130, 246, 0.12);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.3);
        }
        #status.warning {
            display: flex;
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.3);
        }

        /* ===== SCANNER ===== */
        .scanner-area {
            position: relative;
            background: #0a0a18;
            border-radius: 20px;
            margin-top: 12px;
            min-height: 280px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        #qr-reader {
            width: 100% !important;
            min-height: 280px;
            background: #0a0a18;
            position: relative;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block !important;
        }

        #qr-reader > div:not(:first-child) { display: none !important; }
        #qr-reader > div:first-child { width: 100% !important; height: auto !important; }
        #qr-reader > div:first-child > div:first-child { width: 100% !important; height: auto !important; }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanner-overlay .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62%;
            height: 42%;
            border: 2px solid rgba(37, 211, 102, 0.5);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
        }

        .scanner-overlay .scan-frame .corner {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--primary);
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 6px var(--primary-glow));
        }
        .scanner-overlay .scan-frame .corner-tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; border-radius: 6px 0 0 0; }
        .scanner-overlay .scan-frame .corner-tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 6px 0 0; }
        .scanner-overlay .scan-frame .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 6px; }
        .scanner-overlay .scan-frame .corner-br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 6px 0; }

        .scanner-overlay .scan-line {
            position: absolute;
            top: 30%;
            left: 18%;
            right: 18%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), #4ade80, var(--primary), transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 24px var(--primary-glow), 0 0 60px var(--primary-glow);
        }

        @keyframes scanMove {
            0% { top: 30%; opacity: 0.4; }
            50% { top: 70%; opacity: 1; }
            100% { top: 30%; opacity: 0.4; }
        }

        .scanner-overlay .scan-text {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .scanner-overlay .scan-text i {
            color: var(--primary);
            font-size: 12px;
            animation: pulse-icon 1.5s ease-in-out infinite;
        }

        @keyframes pulse-icon { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ===== SCANNER CONTROLS ===== */
        .scanner-controls {
            display: flex;
            gap: 10px;
            padding: 14px 0 4px;
        }

        .scanner-controls button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-scan {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--primary-glow); }
        .btn-scan.stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
        }
        .btn-scan.stop:hover { box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4); }

        .btn-flash {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid var(--border);
            flex: 0.35;
        }
        .btn-flash:hover { background: rgba(255, 255, 255, 0.12); }
        .btn-flash.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1a2e;
            border-color: #fbbf24;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }

        /* ===== DATA SECTION ===== */
        .data-section {
            margin-top: 16px;
            background: var(--bg-card);
            border-radius: 18px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .data-section .data-header {
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.1), rgba(37, 211, 102, 0.02));
            border-bottom: 1px solid rgba(37, 211, 102, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-section .data-header .title {
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-section .data-header .title i { color: var(--primary); font-size: 15px; }

        .data-section .data-header .count {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .data-section .table-wrapper {
            max-height: 220px;
            overflow-y: auto;
        }

        .data-section .table-wrapper::-webkit-scrollbar { width: 4px; }
        .data-section .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .data-section .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(37, 211, 102, 0.3);
            border-radius: 4px;
        }

        .data-section table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-section table th {
            padding: 10px 12px;
            text-align: left;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(18, 18, 35, 0.98);
            backdrop-filter: blur(8px);
        }

        .data-section table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .data-section table tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .data-section table .status-hadir { color: #4ade80; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .data-section table .status-belum { color: rgba(255, 255, 255, 0.3); display: inline-flex; align-items: center; gap: 4px; }

        /* ===== FOOTER ===== */
        .footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.8;
            font-weight: 500;
        }
        .footer-note i { color: var(--primary); }
        .footer-note a { color: var(--primary); text-decoration: none; font-weight: 700; transition: opacity 0.2s; }
        .footer-note a:hover { opacity: 0.8; text-decoration: underline; }

        /* ===== LOADING ===== */
        .loading-text {

            font-size: 13px;

            .qr-input-group { flex-direction: column; }

            h1 { font-size: 19px; }

        /* ===== ANIMATIONS FOR ROWS ===== */
        @keyframes fadeInRow {

            to { opacity: 1; transform: translateX(0); }
        }

        #tableBody tr {
            animation: fadeInRow 0.3s ease forwards;
        }
        #tableBody tr:nth-child(1) { animation-delay: 0.02s; }
        #tableBody tr:nth-child(2) { animation-delay: 0.04s; }
        #tableBody tr:nth-child(3) { animation-delay: 0.06s; }
        #tableBody tr:nth-child(4) { animation-delay: 0.08s; }
        #tableBody tr:nth-child(5) { animation-delay: 0.1s; }
    </style>
</head>
